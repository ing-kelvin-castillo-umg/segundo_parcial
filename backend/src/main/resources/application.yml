server:
  port: ${PORT:8080}

spring:
  application:
    name: examen-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/examen_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

app:
  jwt:
    # 256-bit secret key for HMAC-SHA256 (Base64 encoded)
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # Access token JWT de corta duración (20 s por defecto para la demostración)
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:5000}
    # Refresh token opaco persistido en BD, con rotación en cada uso (24 h por defecto)
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000}
    # Cada cuánto se eliminan la lista negra de jti y los refresh tokens ya expirados (5 min)
    cleanup-interval-ms: ${JWT_CLEANUP_INTERVAL_MS:300000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
