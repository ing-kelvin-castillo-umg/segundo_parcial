version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: examen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: examen_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d examen_db"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examen_backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/examen_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_LIQUIBASE_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      # Access token corto (20 s) para demostrar el refresh; refresh token de 24 h
      JWT_ACCESS_EXPIRATION_MS: 20000
      JWT_REFRESH_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Cierre de sesión tras 30 s sin actividad; el aviso aparece 10 s antes
        NEXT_PUBLIC_IDLE_TIMEOUT_MS: 30000
        NEXT_PUBLIC_IDLE_WARNING_MS: 10000
    container_name: examen_frontend
    restart: unless-stopped
    environment:
      # URL del backend dentro de la red de compose; solo la usa el servidor de Next.js (BFF)
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    name: examen_app_network
    driver: bridge

volumes:
  postgres_data:
    name: examen_postgres_data
